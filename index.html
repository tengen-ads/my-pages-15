    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Neon Background Glow Animation */
        .bg-glow {
            position: fixed;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(0, 162, 255, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseGlow 3s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        /* Main Wrapper */
        .landing-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Circular Profile Avatar with Ring Pulse */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            box-shadow: 0 0 25px rgba(0, 162, 255, 0.8), inset 0 0 15px rgba(0, 210, 255, 0.5);
            animation: avatarPulse 2.5s infinite alternate ease-in-out;
        }

        @keyframes avatarPulse {
            0% { box-shadow: 0 0 15px rgba(0, 162, 255, 0.6); transform: scale(1); }
            100% { box-shadow: 0 0 35px rgba(0, 210, 255, 1), 0 0 10px rgba(0, 102, 255, 0.8); transform: scale(1.03); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000000;
            background-color: #050b14;
        }

        /* Headline & Blue Verified Tick */
        .headline-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .headline {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Animated Blue Tick */
        .verified-tick {
            color: #0095f6;
            font-size: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: tickGlow 2s infinite alternate ease-in-out;
        }

        @keyframes tickGlow {
            0% { filter: drop-shadow(0 0 2px #0095f6); transform: scale(1); }
            100% { filter: drop-shadow(0 0 8px #00d2ff); transform: scale(1.15); }
        }

        /* Sub Headline */
        .sub-headline {
            color: #00d2ff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .description {
            color: #a0aec0;
            font-size: 13.5px;
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
            font-weight: 500;
        }

        /* Ultra Animated CTA Button */
        .btn-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(90deg, #0088cc, #00d2ff, #0055ff);
            background-size: 200% auto;
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 800;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.7);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: btnGradient 3s infinite linear, btnPulse 1.8s infinite ease-in-out;
            letter-spacing: 0.5px;
        }

        @keyframes btnGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes btnPulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 162, 255, 0.6); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(0, 210, 255, 1); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 162, 255, 0.6); }
        }

        /* Shining Light Line Effect inside Button */
        .cta-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(30deg);
            animation: btnShine 2.5s infinite ease-in-out;
        }

        @keyframes btnShine {
            0% { left: -60%; }
            20% { left: 140%; }
            100% { left: 140%; }
        }

        .cta-btn i.rocket-icon {
            font-size: 18px;
            animation: rocketFly 1.5s infinite alternate ease-in-out;
        }

        @keyframes rocketFly {
            0% { transform: translate(0, 0); }
            100% { transform: translate(3px, -3px); }
        }

        /* Timer Box Container */
        .timer-container {
            border: 1.5px solid rgba(0, 180, 255, 0.6);
            border-radius: 18px;
            padding: 18px 15px;
            background: rgba(0, 15, 35, 0.7);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.2);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
            animation: borderGlow 3s infinite alternate ease-in-out;
        }

        @keyframes borderGlow {
            0% { border-color: rgba(0, 140, 255, 0.4); box-shadow: 0 0 10px rgba(0, 140, 255, 0.2); }
            100% { border-color: rgba(0, 210, 255, 0.9); box-shadow: 0 0 25px rgba(0, 210, 255, 0.4); }
        }

        .timer-title {
            color: #00d2ff;
            font-size: 15px;

            margin-bottom: 15px;

            justify-content: center;

        }

            font-size: 12px;
            font-weight: 500;

    <!-- Live Timer & Anti-Bot Shield Scripts -->
    <script>
        // 1. Live Countdown Timer (Auto 15 Min Loop)
        let totalSeconds = 15 * 60;
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");

        function updateTimer() {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            minutesEl.textContent = m < 10 ? '0' + m : m;
            secondsEl.textContent = s < 10 ? '0' + s : s;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                totalSeconds = 15 * 60; // Reset timer when finished
            }
        }
        setInterval(updateTimer, 1000);

        // 2. Anti-Bot & Anti-Fake Click Security System
        let isHumanDetected = false;
        const pageStartTime = Date.now();

        // Detect Bot User Agents (Meta Crawler, FB Bots, PhantomJS, Headless Chrome)
        const knownBots = [
            'facebookexternalhit', 'facebookcatalog', 'facebookbot', 'metagenerator',
            'telegrambot', 'headlesschrome', 'puppeteer', 'selenium', 'phantomjs', 'bot', 'crawler', 'spider'
        ];
        const currentUA = navigator.userAgent.toLowerCase();
        const isBotAgent = knownBots.some(bot => currentUA.includes(bot));
        const isHeadlessBrowser = navigator.webdriver || !navigator.languages || navigator.languages.length === 0;

        // Neuturalize for Bots
        if (isBotAgent || isHeadlessBrowser) {
            document.addEventListener("DOMContentLoaded", function() {
                const btn = document.getElementById("telegramBtn");
                if (btn) btn.href = "javascript:void(0);";
            });
        }

        // Register Real Human Interaction
        function registerHumanActivity() {
            isHumanDetected = true;
            window.removeEventListener("mousemove", registerHumanActivity);
            window.removeEventListener("touchstart", registerHumanActivity);
            window.removeEventListener("scroll", registerHumanActivity);
        }

        window.addEventListener("mousemove", registerHumanActivity);
        window.addEventListener("touchstart", registerHumanActivity);
        window.addEventListener("scroll", registerHumanActivity);

        // Secure Click Verification Function
        function handleSecureClick(e) {
            const currentTime = Date.now();
            const timeElapsed = currentTime - pageStartTime;

            // Block clicks if faster than 800ms OR without real mouse/touch movement
            if (timeElapsed < 800 || !isHumanDetected) {
                e.preventDefault();
                console.warn("Blocked automated click attempt.");
                return false;
            }

            // Track Meta Pixel Lead Event for Real User
            if (typeof fbq === 'function') {
                fbq('track', 'Lead');
            }
        }
    </script>
